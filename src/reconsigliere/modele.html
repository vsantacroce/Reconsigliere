<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconsigliere</title>
<style>
  :root { --fond:#f6f7f9; --carte:#fff; --texte:#1d2430; --doux:#667085; --ligne:#e4e7ec;
          --vert:#1f8a4c; --bleu:#2563eb; --orange:#c2410c; --jaune:#a16207; --gris:#6b7280; }
  @media (prefers-color-scheme: dark) {
    :root { --fond:#111418; --carte:#1a1f26; --texte:#e6e9ee; --doux:#9aa4b2; --ligne:#2b323c; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--fond); color:var(--texte); }
  header { padding:20px 16px 8px; max-width:1400px; margin:auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  .doux { color:var(--doux); }
  .compteurs { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  .compteur { background:var(--carte); border:1px solid var(--ligne); border-radius:10px; padding:8px 12px; cursor:pointer; }
  .compteur b { font-size:18px; display:block; }
  .compteur.actif { outline:2px solid var(--bleu); }
  .outils { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:1px solid var(--ligne); background:var(--carte); color:var(--texte); }
  main { max-width:1400px; margin:auto; padding:0 16px 40px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:var(--carte); border-radius:10px; overflow:hidden; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--ligne); text-align:left; vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--doux); cursor:pointer; white-space:nowrap; }
  td.montant { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .pastille { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; color:#fff; white-space:nowrap; }
  .libelle { max-width:380px; color:var(--doux); font-size:12px; }
  a { color:var(--bleu); }
  code { font-size:11px; color:var(--doux); }
  details { margin-top:24px; }
</style>
</head>
<body>
<header>
  <h1>Reconsigliere · réconciliation bancaire</h1>
  <div class="doux" id="sous-titre"></div>
  <div class="compteurs" id="compteurs"></div>
  <div class="outils"><input id="recherche" placeholder="Rechercher un partenaire, un libellé, un montant, un id…"></div>
</header>
<main>
  <table>
    <thead><tr>
      <th data-c="date">Date</th><th data-c="montant">Montant</th><th data-c="partenaire">Partenaire</th>
      <th data-c="statut">Statut</th><th data-c="compte_propose">Compte proposé</th><th data-c="pdf_renomme">Pièce</th><th data-c="explication">Explication</th><th data-c="id_transaction">Id</th>
    </tr></thead>
    <tbody id="corps"></tbody>
  </table>
  <details><summary>PDF sans transaction (<span id="nb-orph"></span>)</summary><ul id="orphelins"></ul></details>
</main>
<script>
const D = __DONNEES__;
const COULEURS = {"Comptabilisé":"var(--vert)","À comptabiliser":"var(--bleu)","À confirmer":"var(--jaune)",
  "PDF manquant":"var(--orange)","Expliqué sans pièce":"var(--gris)","Ignoré":"var(--gris)"};
let filtre = null, tri = "date", sens = 1;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n.toLocaleString("fr-CH", {minimumFractionDigits:2, maximumFractionDigits:2});
function compteurs() {
  const n = {}; D.lignes.forEach(l => n[l.statut] = (n[l.statut]||0)+1);
  const el = document.getElementById("compteurs");
  el.innerHTML = `<div class="compteur ${filtre?"":"actif"}" data-s=""><b>${D.lignes.length}</b>Toutes</div>` +
    Object.entries(n).map(([s,v]) => `<div class="compteur ${filtre===s?"actif":""}" data-s="${esc(s)}"><b style="color:${COULEURS[s]||"inherit"}">${v}</b>${esc(s)}</div>`).join("");
  el.querySelectorAll(".compteur").forEach(c => c.onclick = () => { filtre = c.dataset.s || null; rendre(); });
}
function rendre() {
  compteurs();
  const q = document.getElementById("recherche").value.toLowerCase();
  const lignes = D.lignes.filter(l => (!filtre || l.statut===filtre) &&
      (!q || Object.values(l).join(" ").toLowerCase().includes(q)))
    .sort((a,b) => (a[tri] > b[tri] ? 1 : a[tri] < b[tri] ? -1 : 0) * sens);
  document.getElementById("corps").innerHTML = lignes.map(l => `<tr>
    <td>${esc(l.date)}</td>
    <td class="montant">${fmt(l.montant)} ${esc(D.devise)}</td>
    <td><b>${esc(l.partenaire)}</b><div class="libelle">${esc(l.libelle)}</div></td>
    <td><span class="pastille" style="background:${COULEURS[l.statut]||"var(--gris)"}">${esc(l.statut)}</span>
        ${l.score ? `<div class="doux" style="font-size:11px">score ${l.score} · ${esc(l.raisons)}</div>` : ""}</td>
    <td>${l.compte_propose ? `${esc(l.compte_propose)}<div class="doux" style="font-size:11px">${esc(l.fiabilite_compte)}</div>` : "—"}</td>
    <td>${l.pdf_renomme ? `<a href="pdf_renommes/${encodeURIComponent(l.pdf_renomme)}" target="_blank">${esc(l.pdf_renomme)}</a><div class="doux" style="font-size:11px">${esc(l.pdf_original)}</div>` : "—"}</td>
    <td>${esc(l.explication)}</td>
    <td><code>${esc(l.id_transaction)}</code></td></tr>`).join("");
  document.getElementById("sous-titre").textContent = `${lignes.length} transaction(s) affichée(s)`;
}
document.getElementById("recherche").oninput = rendre;
document.querySelectorAll("th").forEach(th => th.onclick = () => {
  sens = tri === th.dataset.c ? -sens : 1; tri = th.dataset.c; rendre(); });
document.getElementById("nb-orph").textContent = D.orphelins.length;
document.getElementById("orphelins").innerHTML = D.orphelins.map(n => `<li>${esc(n)}</li>`).join("");
rendre();
</script>
</body>
</html>
